
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akutana | Game Programmer</title>
    <meta name="description" content="Game programmer portfolio.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #111111;
            color: #f5f5f5;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 90%);
            margin: 0 auto;
        }

        header {
            padding: 24px 0;
            border-bottom: 1px solid #333333;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        nav ul {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        #hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            padding: 80px 0;
        }

        #hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 16px;
        }

        #hero p {
            color: #aaaaaa;
            font-size: 1.2rem;
        }
        section {
            padding: 80px 0;
            border-top: 1px solid #333333;
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 24px;
        }

        footer {
            padding: 32px 0;
            border-top: 1px solid #333333;
            color: #aaaaaa;
            text-align: center;
        }

      
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            #hero {
                min-height: 60vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="container">
            <a href="#hero"><strong>Akutana</strong></a>

            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="container">
                <h1>Your Name</h1>
                <p>Junior Game Programmer | Unreal Engine & Unity | C++ / C#</p>
            </div>
        </section>

        <section id="about">
            <div class="container">
                <h2>About Me</h2>
            </div>
        </section>

        <section id="projects">
            <div class="container">
                <h2>Projects</h2>
            </div>
        </section>

        <section id="skills">
            <div class="container">
                <h2>Skills</h2>
            </div>
        </section>

        <section id="contact">
            <div class="container">
                <h2>Contact</h2>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Akutana</p>
        </div>
    </footer>

</body>
</html>
