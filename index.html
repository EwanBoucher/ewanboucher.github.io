
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ewan Boucher | Game Programmer</title>
    <meta name="description" content="Ewan Boucher's game programming portfolio.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&family=Share+Tech+Mono&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <style>
        /*Variables*/
        :root {
            --background: #101014;
            --surface: #19191F;
            --surface-hover: #22212A;
            --accent: #B47FFF;
            --text: #F2EDF8;
            --text-muted: #9993A5;
            --border: #302B38;

            --sidebar-width: 250px;
            --content-width: 1100px;
        }

        /*Reset & Global*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: "Saira", sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: "Space Grotesk", sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        button {
            color: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--sidebar-width);
            padding: 40px 28px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background: var(--background);
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .identity {
            margin-bottom: 48px;
        }

        .identity h1 {
            font-size: 1.7rem;
            line-height: 1.2;
            letter-spacing: -0.04em;
        }

        .identity p {
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .navigation {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: block;
            width: 100%;
            padding: 12px 14px;

            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;

            color: var(--text-muted);
            text-align: left;
            cursor: pointer;

            transition:
                color 180ms ease,
                background 180ms ease,
                border-color 180ms ease;
        }

        .nav-link:hover {
            color: var(--text);
            background: var(--surface);
        }

        .nav-link.active {
            color: var(--accent);
            background: rgba(180, 127, 255, 0.09);
            border-color: rgba(180, 127, 255, 0.18);
        }

        .sidebar-bottom {
            margin-top: 48px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .sidebar-bottom span {
            color: var(--accent);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        main {
            min-height: 100vh;
            margin-left: var(--sidebar-width);
            padding: 72px 7%;
        }

        .home-hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .home-hero h1 {
            font-size: clamp(2.5rem, 6vw, 6rem);
        }

        .home-hero p {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
        }

        .content-container {
            width: 100%;
            max-width: var(--content-width);
            margin: 0 auto;
        }

        .page {
            display: none;
            animation: page-enter 250ms ease both;
        }

        .page.active {
            display: block;
        }

        .page-label {
            margin-bottom: 16px;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        
        .page h2 {
            margin-bottom: 24px;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            line-height: 1.15;
            letter-spacing: -0.04em;
        }

        .page-placeholder {
            min-height: 200px;
            padding: 28px;

            display: flex;
            align-items: center;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text-muted);
        }

        /* Hamburger button: hidden on desktop */
        .menu-toggle {
            display: none;
        }

        /*Page Transition*/
        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }        

        @media (max-width: 760px) {
            .menu-toggle {
                display: block;
                position: fixed;
                top: 16px;
                right: 20px;
                z-index: 1001;

                background: var(--surface);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 8px 12px;

                font-size: 1.5rem;
                cursor: pointer;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;

                width: 250px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;

                background: var(--background);
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            main {
                margin-left: 0;
                padding: 80px 20px 30px;
            }
        }

    </style>
</head>

<body>
    <button class="menu-toggle" id="menuToggle"
        aria-label="Open navigation menu"
        aria-expanded="false">
    ☰
    </button>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">

        <nav class="navigation" aria-label="Main navigation">
        <div class="identity">
            <button class="nav-link active"
                    data-page="home"
                    aria-controls="home"
                    aria-current="page">
                <h1>Ewan</h1>
            </button>
        </div>

            <button class="nav-link"
                    data-page="projects"
                    aria-controls="projects">
                Projects
            </button>

            <button class="nav-link"
                    data-page="skills"
                    aria-controls="skills">
                Skills
            </button>

            <button class="nav-link"
                    data-page="education"
                    aria-controls="education">
                Education
            </button>

            <button class="nav-link"
                    data-page="contact"
                    aria-controls="contact">
                Contact
            </button>
        </nav>

    </aside>

    <!-- Main Content -->
    <main>
        <div class="content-container">

            <section class="page active"
                     id="home"
                     aria-labelledby="home-title">
                <!-- <br><br><br><br><br>
                <h1 style="font-size:clamp(2rem, 6vw, 6rem);
                           text-align:center;">Ewan Boucher</h1>
                <p style="text-align:center;
                          font-size:200%;">Junior Game Programmer</p> -->

                <div class="home-hero">
                    <h1 id="home-title">Ewan Boucher</h1>
                    <p>Junior Game Programmer</p>
                </div>

                <div class="page-placeholder">
                    <p>Blablabla</p>
                </div>
            </section>

            <section class="page"
                     id="projects"
                     aria-labelledby="projects-title"
                     hidden>
                <p class="page-label">01 / Portfolio</p>
                <h2 id="projects-title">Projects</h2>

                <div class="page-placeholder">
                    <!-- Projects content goes here -->
                </div>
            </section>

            <section class="page"
                     id="skills"
                     aria-labelledby="skills-title"
                     hidden>
                <p class="page-label">02 / Expertise</p>
                <h2 id="skills-title">Skills</h2>

                <div class="page-placeholder">
                    <!-- Skills content goes here -->
                </div>
            </section>

            <section class="page"
                     id="education"
                     aria-labelledby="education-title"
                     hidden>
                <p class="page-label">03 / Background</p>
                <h2 id="education-title">Education</h2>

                <div class="page-placeholder">
                    <!-- Education content goes here -->
                </div>
            </section>

            <section class="page"
                     id="contact"
                     aria-labelledby="contact-title"
                     hidden>
                <p class="page-label">04 / Get in touch</p>
                <h2 id="contact-title">Contact</h2>

                <div class="page-placeholder">
                    <!-- Contact information goes here -->
                </div>
            </section>

        </div>
    </main>

    <!-- Page Navigation -->
    <script>
        const navigationLinks = document.querySelectorAll(".nav-link");
        const pages = document.querySelectorAll(".page");

        function showPage(pageId) {
            pages.forEach((page) => {
                const isActive = page.id === pageId;

                page.classList.toggle("active", isActive);
                page.hidden = !isActive;
            });

            navigationLinks.forEach((link) => {
                const isActive = link.dataset.page === pageId;

                link.classList.toggle("active", isActive);

                if (isActive) {
                    link.setAttribute("aria-current", "page");
                } else {
                    link.removeAttribute("aria-current");
                }
            });
        }

        navigationLinks.forEach((link) => {
            link.addEventListener("click", () => {
                showPage(link.dataset.page);
                sidebar.classList.remove("open");
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Open navigation menu");
                menuToggle.textContent = "☰";
            });
        });

        const menuToggle = document.getElementById("menuToggle");
        const sidebar = document.querySelector(".sidebar");

        menuToggle.addEventListener("click", () => {
            const isOpen = sidebar.classList.toggle("open");

            menuToggle.setAttribute("aria-expanded", isOpen);
            menuToggle.setAttribute(
                "aria-label",
                isOpen ? "Close navigation menu" : "Open navigation menu"
            );

            menuToggle.textContent = isOpen ? "✕" : "☰";
        });
    </script>
</body>
</html>
